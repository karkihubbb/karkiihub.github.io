
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarkiAI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f7f8fa;
 color:#202124;
}
header{
 padding:20px;
 border-bottom:1px solid #e8e8e8;
 background:white;
 font-size:21px;
 font-weight:bold;
}
header span{color:#777;font-size:13px;font-weight:normal}
main{
 max-width:800px;
 margin:auto;
 padding:25px 18px;
}
#welcome{margin-top:65px;text-align:center}
#welcome h1{font-size:32px}
#welcome p{color:#777}
#chat{
 display:flex;
 flex-direction:column;
 gap:15px;
 padding-bottom:110px;
}
.message{
 padding:14px 17px;
 border-radius:15px;
 max-width:90%;
 line-height:1.6;
 white-space:pre-wrap;
}
.user{
 background:#e9edf3;
 align-self:flex-end;
}
.ai{
 background:white;
 border:1px solid #eee;
 align-self:flex-start;
}
#status{font-size:13px;color:#777;margin-bottom:10px}
.input-area{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 padding:15px;
 background:#f7f8fa;
}
.input-box{
 max-width:760px;
 margin:auto;
 display:flex;
 gap:10px;
 background:white;
 padding:9px;
 border:1px solid #ddd;
 border-radius:16px;
}
input{
 flex:1;
 border:0;
 outline:0;
 padding:12px;
 font-size:16px;
 min-width:0;
}
button{
 border:0;
 background:#202124;
 color:white;
 padding:12px 17px;
 border-radius:11px;
 cursor:pointer;
}
button:disabled{opacity:.5}
</style>
</head>

<body>

<header>
 KarkiAI <span> · Your AI assistant</span>
</header>

<main>
 <div id="welcome">
  <h1>Hey! How can I help you?</h1>
  <p>Ask me anything.</p>
 </div>
 <div id="status">AI model is not loaded yet.</div>
 <div id="chat"></div>
</main>

<div class="input-area">
 <div class="input-box">
  <input id="prompt" placeholder="Message KarkiAI..." />
  <button id="send">Send</button>
 </div>
</div>

<script type="module">
import { pipeline } from
'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4';

const MODEL = 'onnx-community/Qwen2.5-1.5B-Instruct';

const status = document.getElementById('status');
const input = document.getElementById('prompt');
const send = document.getElementById('send');
const chat = document.getElementById('chat');
const welcome = document.getElementById('welcome');

let ai = null;
let history = [];
let busy = false;

async function loadAI(){
 if(ai) return ai;

 status.textContent = 'Downloading AI model... Please wait.';

 try {
  try {
   ai = await pipeline('text-generation', MODEL, {
    dtype:'q4',
    device:'webgpu'
   });
  } catch(e) {
   ai = await pipeline('text-generation', MODEL, {
    dtype:'q4'
   });
  }

  status.textContent = 'KarkiAI is ready!';
  return ai;

 } catch(error) {
  status.textContent = 'Could not load AI. Check your internet and reload.';
  throw error;
 }
}

function addMessage(text,type){
 const div = document.createElement('div');
 div.className = 'message ' + type;
 div.textContent = text;
 chat.appendChild(div);
 window.scrollTo(0,document.body.scrollHeight);
 return div;
}

async function reply(){
 const question = input.value.trim();

 if(!question || busy) return;

 welcome.style.display='none';
 input.value='';
 busy=true;
 send.disabled=true;

 addMessage(question,'user');
 const answer = addMessage('Thinking...','ai');

 try{
  const model = await loadAI();

  history.push({role:'user',content:question});

  const messages = [
   {
    role:'system',
    content:'You are KarkiAI, a friendly and helpful AI assistant. Answer questions clearly in simple English. Help with general knowledge, school subjects, maths, technology and everyday questions. Be accurate and admit when you do not know something.'
   },
   ...history.slice(-8)
  ];

  const result = await model(messages,{
   max_new_tokens:180,
   temperature:0.7,
   do_sample:true
  });

  const output = result[0].generated_text;
  const text = output[output.length-1].content;

  answer.textContent=text || 'I could not generate an answer.';
  history.push({role:'assistant',content:text});

 }catch(error){
  answer.textContent='Sorry, something went wrong. Please try again.';
  console.error(error);
 }

 busy=false;
 send.disabled=false;
 input.focus();
}

send.addEventListener('click',reply);

input.addEventListener('keydown',e=>{
 if(e.key==='Enter') reply();
});

</script>
</body>
</html>
