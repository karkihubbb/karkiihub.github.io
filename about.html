<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#09090b;--s1:#111114;--line:#27272a;--tx:#fafafa;--mu:#a1a1aa;--ac:#fafafa;--ease:cubic-bezier(.2,.7,.2,1)}
@view-transition{navigation:auto}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body.kv{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 Geist,system-ui,sans-serif;overflow-x:hidden}
.kv a{color:inherit}
.kv :focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}
.kv-wrap{width:min(1100px,92%);margin:auto}
.kv-header{position:sticky;top:0;z-index:30;background:#09090be6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.kv-bar{width:min(1100px,92%);margin:auto;height:64px;display:flex;align-items:center;justify-content:space-between}
.kv-logo{font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none}
.kv-nav{position:relative;display:flex;gap:2px}
.kv-nav a{padding:21px 14px;color:var(--mu);text-decoration:none;font-size:14px;font-weight:500;transition:color .2s}
.kv-nav a:hover,.kv-nav a[aria-current=page]{color:var(--tx)}
.kv-ind{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--ac);transition:left .35s var(--ease),width .35s var(--ease)}
.kv-burger{display:none;background:none;border:1px solid var(--line);color:var(--tx);width:44px;height:44px;border-radius:8px;cursor:pointer}
.kv-btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 24px;border-radius:8px;background:var(--ac);color:var(--bg);font:700 15px Geist,sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .15s var(--ease),filter .2s}
.kv-btn:hover{filter:brightness(1.1)}.kv-btn:active{transform:scale(.96)}
.kv-btn.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.kv-foot{border-top:1px solid var(--line);margin-top:80px;padding:26px 0 40px;color:var(--mu);font-size:14px}
.kv-foot .kv-wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
html.js .rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
html.js .rv.in{opacity:1;transform:none}
@media(max-width:720px){
 .kv-burger{display:block}
 .kv-nav{position:fixed;inset:64px 0 auto 0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 4%;transform:translateY(-12px);opacity:0;visibility:hidden;transition:.25s var(--ease)}
 .kv-nav.open{transform:none;opacity:1;visibility:visible}
 .kv-nav a{padding:16px 4px;font-size:17px;border-bottom:1px solid var(--line)}
 .kv-ind{display:none}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}html.js .rv{opacity:1;transform:none;transition:none}*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style><title>My Life | KarkiVerse</title><style>
h1{font:800 clamp(36px,6vw,64px)/1.05 Geist,system-ui,sans-serif;letter-spacing:-.035em;margin:0}.top{padding:64px 0 36px}.top p{color:var(--mu);max-width:50ch}
.g{columns:3 280px;column-gap:16px}.ph{margin:0 0 16px;break-inside:avoid}.ph button{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--s1);cursor:zoom-in}
.ph img{display:block;width:100%;height:auto;transition:transform .6s var(--ease)}.ph button:hover img{transform:scale(1.04)}.ph figcaption{color:var(--mu);font-size:14px;padding:8px 2px}
dialog{border:0;background:none;padding:0;max-width:96vw;max-height:94vh;color:var(--tx)}dialog::backdrop{background:#05070dec}dialog[open]{animation:in .3s var(--ease)}@keyframes in{from{opacity:0;transform:scale(.96)}}
dialog img{max-width:96vw;max-height:82vh;border-radius:8px;display:block;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px}.bar button{min-height:44px;min-width:44px;background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
</style></head><body class="kv"><header class="kv-header"><div class="kv-bar"><a class="kv-logo" href="index.html">KarkiVerse</a><button class="kv-burger" aria-label="Menu" aria-expanded="false" aria-controls="nav">☰</button><div class="kv-nav" id="nav" role="navigation" aria-label="Main"><a href="index.html">Home</a><a href="about.html">My Life</a><a href="games.html">Games</a><a href="voices.html">Voice</a><a href="karkiai.html">KarkiAI</a></div></div></header><main class="kv-wrap"><section class="top"><h1>My Life</h1><p>Places and moments from around Dharan. Tap a photo to see it full size.</p></section><div class="g"><figure class="ph rv"><button data-i="0" aria-label="Open: A view worth remembering"><img src="assets/mylife/IMG_1252.jpeg" alt="Green hills stretching into the distance" loading="lazy"></button><figcaption>A view worth remembering</figcaption></figure><figure class="ph rv"><button data-i="1" aria-label="Open: Along the way"><img src="assets/mylife/IMG_1398(1).jpeg" alt="Open sky and green hills with a road ahead" loading="lazy"></button><figcaption>Along the way</figcaption></figure><figure class="ph rv"><button data-i="2" aria-label="Open: Dharan clock tower"><img src="assets/mylife/IMG_1235.jpeg" alt="Dharan clock tower" loading="lazy"></button><figcaption>Dharan clock tower</figcaption></figure><figure class="ph rv"><button data-i="3" aria-label="Open: Into the green"><img src="assets/mylife/IMG_1236.jpeg" alt="A path surrounded by trees" loading="lazy"></button><figcaption>Into the green</figcaption></figure><figure class="ph rv"><button data-i="4" aria-label="Open: A walk through nature"><img src="assets/mylife/IMG_1405.jpeg" alt="A walk through nature" loading="lazy"></button><figcaption>A walk through nature</figcaption></figure><figure class="ph rv"><button data-i="5" aria-label="Open: A bridge between the hills"><img src="assets/mylife/IMG_1468.jpeg" alt="A bridge between forested hills" loading="lazy"></button><figcaption>A bridge between the hills</figcaption></figure><figure class="ph rv"><button data-i="6" aria-label="Open: Waterfall"><img src="assets/mylife/IMG_1475.jpeg" alt="Waterfall view" loading="lazy"></button><figcaption>Waterfall</figcaption></figure><figure class="ph rv"><button data-i="7" aria-label="Open: The open road"><img src="assets/mylife/IMG_1361.jpeg" alt="A winding road through green countryside" loading="lazy"></button><figcaption>The open road</figcaption></figure></div></main><footer class="kv-foot"><div class="kv-wrap"><span>© 2026 KarkiVerse</span><span>Made by Sarwagya Karki</span></div></footer>
<dialog id="d" aria-label="Photo viewer"><img alt=""><div class="bar"><button id="pv" aria-label="Previous">←</button><span id="cp"></span><button id="nx" aria-label="Next">→</button><button id="cl" aria-label="Close">✕</button></div></dialog>
<script>(()=>{
const d=document,root=d.documentElement,calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
root.classList.add('js');
const nav=d.querySelector('.kv-nav'),burger=d.querySelector('.kv-burger');
if(nav){
 const here=location.pathname.split('/').pop()||'index.html';
 const links=[...nav.querySelectorAll('a')];
 links.forEach(a=>{if(a.getAttribute('href')===here)a.setAttribute('aria-current','page')});
 const ind=d.createElement('span');ind.className='kv-ind';nav.appendChild(ind);
 const to=a=>{if(!a){ind.style.width='0';return}ind.style.left=a.offsetLeft+'px';ind.style.width=a.offsetWidth+'px'};
 const cur=()=>nav.querySelector('[aria-current=page]');
 links.forEach(a=>{a.addEventListener('pointerenter',()=>to(a));a.addEventListener('focus',()=>to(a))});
 nav.addEventListener('pointerleave',()=>to(cur()));addEventListener('resize',()=>to(cur()));
 requestAnimationFrame(()=>to(cur()));
 if(burger){
  burger.addEventListener('click',()=>{const o=nav.classList.toggle('open');burger.setAttribute('aria-expanded',o);burger.textContent=o?'✕':'☰'});
  links.forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));
 }
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12}):null;
d.querySelectorAll('.rv').forEach(el=>io?io.observe(el):el.classList.add('in'));
if(!calm&&matchMedia('(hover:hover) and (pointer:fine)').matches){
 d.querySelectorAll('[data-mag]').forEach(el=>{
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.28}px)`});
  el.addEventListener('pointerleave',()=>{el.style.transform=''});
 });
 const px=[...d.querySelectorAll('[data-parallax]')];
 if(px.length){let t=false;addEventListener('scroll',()=>{if(t)return;t=true;requestAnimationFrame(()=>{px.forEach(el=>{const r=el.parentElement.getBoundingClientRect();el.style.transform=`translateY(${(r.top+r.height/2-innerHeight/2)*-.08}px) scale(1.12)`});t=false})},{passive:true})}
}
})();
</script><script>
const d=document.getElementById('d'),im=d.querySelector('img'),bs=[...document.querySelectorAll('.ph button')];let k=0;
const show=i=>{k=(i+bs.length)%bs.length;const s=bs[k].querySelector('img');im.src=s.src;im.alt=s.alt;document.getElementById('cp').textContent=s.alt};
bs.forEach((b,i)=>b.addEventListener('click',()=>{show(i);d.showModal()}));
pv.onclick=()=>show(k-1);nx.onclick=()=>show(k+1);cl.onclick=()=>d.close();
d.addEventListener('click',e=>{if(e.target===d)d.close()});
d.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
</script></body></html>
