
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarkiAI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#101713;color:#f3f7f3;
 min-height:100vh;display:flex;justify-content:center;
}
.app{width:100%;max-width:900px;height:100vh;display:flex;flex-direction:column;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #29352d}
.logo{font-size:23px;font-weight:800}
.logo span{color:#8ed6a0}
.status{font-size:12px;color:#9bb8a2}
.chat{flex:1;overflow-y:auto;padding:22px 4px;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;margin:auto;max-width:500px}
.welcome .symbol{display:block;width:138px;height:138px;border-radius:50%;object-fit:cover;margin:0 auto 12px;border:1px solid #344438}
.welcome h1{font-size:30px;margin:12px 0}
.welcome p{color:#aab9ad;line-height:1.6}
.message{max-width:85%;padding:14px 16px;border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#315b3d;border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:#202b23;border:1px solid #344438;border-bottom-left-radius:5px;display:flex;align-items:flex-start;gap:10px}
.bot-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 30px;margin-top:2px}
.bot-content{min-width:0;flex:1}
.bot small{display:block;color:#8ed6a0;font-weight:bold;margin-bottom:6px}
.controls{border-top:1px solid #29352d;padding:14px 0 8px}
.inputrow{display:flex;gap:9px;background:#202b23;padding:9px;border:1px solid #3b4a3e;border-radius:17px}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:9px}
button{border:0;cursor:pointer;border-radius:12px;padding:12px;background:#8ed6a0;color:#102016;font-weight:bold}
button:disabled{opacity:.5}
.iconbtn{background:#344438;color:white;min-width:45px}
.send{min-width:55px}
.hint{text-align:center;font-size:11px;color:#829387;margin-top:10px}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.suggestions button{background:#26372b;color:#ccebd2;border:1px solid #405544;font-size:12px}
@media(max-width:600px){
 .app{padding:10px;height:100dvh}
 .message{max-width:92%}
 .welcome h1{font-size:25px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div style="display:flex;align-items:center;gap:10px;">
  <img src="image.png" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
  <div class="logo">Karki<span>AI</span></div>
 </div>
 <div class="status">● Ready to chat</div>
</header>

<main class="chat" id="chat">
 <div class="welcome" id="welcome">
  <img class="symbol" src="image.png" alt="KarkiAI profile picture">
  <h1>Hey! How can I help you?</h1>
  <p>I'm KarkiAI. Ask me questions, learn something, explore the internet or get help with schoolwork.</p>
  <div class="suggestions">
   <button onclick="suggest('Explain artificial intelligence simply')">What is AI?</button>
   <button onclick="suggest('Help me with maths: 25 × 12')">Math help</button>
   <button onclick="suggest('Tell me about Minecraft')">Minecraft</button>
  </div>
 </div>
</main>

<div class="controls">
 <div class="inputrow">
  <button class="iconbtn" id="mic" onclick="startVoice()" title="Speak">🎙</button>
  <input id="question" placeholder="Ask KarkiAI anything..." autocomplete="off">
  <button class="send" id="send" onclick="sendMessage()">➤</button>
 </div>
 <div class="hint">Enter to send · 🎙 to speak · Replies can be spoken aloud</div>
</div>

</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("question");
const sendBtn=document.getElementById("send");

let speaking=true;
let recognition=null;

function addMessage(text,type){
 const welcome=document.getElementById("welcome");
 if(welcome) welcome.remove();

 const div=document.createElement("div");
 div.className="message "+type;

 if(type==="bot"){
  const avatar=document.createElement("img");
  avatar.src="image.png";
  avatar.alt="KarkiAI profile picture";
  avatar.className="bot-avatar";
  div.appendChild(avatar);

  const wrapper=document.createElement("div");
  wrapper.className="bot-content";

  const label=document.createElement("small");
  label.textContent="KarkiAI";
  wrapper.appendChild(label);

  const content=document.createElement("span");
  content.textContent=text;
  wrapper.appendChild(content);

  div.appendChild(wrapper);
 }else{
  const content=document.createElement("span");
  content.textContent=text;
  div.appendChild(content);
 }

 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

function speak(text){
 if(!speaking || !("speechSynthesis" in window))return;

 window.speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="en-IN";
 utterance.rate=0.92;
 utterance.pitch=0.9;
 utterance.volume=1;

 const voices=window.speechSynthesis.getVoices();
 const voice=voices.find(v=>v.lang==="en-IN")
 ||voices.find(v=>v.lang.startsWith("en"));

 if(voice)utterance.voice=voice;
 window.speechSynthesis.speak(utterance);
}

function stopSpeaking(){
 if("speechSynthesis" in window)
 window.speechSynthesis.cancel();
}

function suggest(text){
 input.value=text;
 sendMessage();
}

function localAnswer(q){
 const s=q.toLowerCase().trim();

 // Greetings
 if(/^(how are you|how r u|how are u|how're you)[?.! ]*$/.test(s))
 return "I'm doing great, thanks for asking! I'm ready to help you. How are you?";

 if(/^(hi|hello|hey|hii|heyy)\b/.test(s))
 return "Hey! Welcome to KarkiAI. What would you like to know?";

 if(s.includes("your name")||s.includes("who are you"))
 return "I'm KarkiAI, a free assistant made for KarkiVerse by Sir Karki.";

 if(s.includes("who made you")||s.includes("who created you"))
 return "I was created for KarkiVerse by Sir Karki.";

 if(s.includes("what can you do"))
 return "I can answer programmed questions, help with basic school topics, maths, internet knowledge, and look up some factual information online.";

 if(s.includes("2+2")||s.includes("2 + 2"))
 return "2 + 2 = 4.";

 if(s.includes("capital of nepal"))
 return "The capital of Nepal is Kathmandu.";

 if(s.includes("capital of india"))
 return "The capital of India is New Delhi.";

 if(s.includes("capital of japan"))
 return "The capital of Japan is Tokyo.";

 if(s.includes("capital of france"))
 return "The capital of France is Paris.";

 if(s.includes("photosynthesis"))
 return "Photosynthesis is the process by which green plants use sunlight, water and carbon dioxide to make food. Oxygen is released during this process.";

 if(s.includes("gravity"))
 return "Gravity is a force that attracts objects towards each other. Earth's gravity pulls objects towards its centre.";

 if(s.includes("internet"))
 return "The Internet is a worldwide network connecting computers and devices. It lets people communicate, share information and use websites.";

 if(s.includes("html"))
 return "HTML stands for HyperText Markup Language. It is used to create the structure of web pages.";

 if(s.includes("css"))
 return "CSS stands for Cascading Style Sheets. It controls how a website looks, including colours, fonts, spacing and layouts.";

 if(s.includes("javascript"))
 return "JavaScript is a programming language that makes websites interactive. It can respond to clicks, update content and perform calculations.";

 if(s.includes("artificial intelligence")||s==="what is ai")
 return "Artificial intelligence (AI) is technology that allows computers to perform tasks such as understanding language, recognising images and solving problems.";

 if(s.includes("minecraft"))
 return "Minecraft is a sandbox game where players explore, build and survive. It has Survival and Creative modes, different dimensions, mobs and crafting.";

 if(s.includes("free fire"))
 return "Free Fire is a battle royale game. Players compete to survive, use characters and equipment, and try to be the last player or team standing.";

 if(s.includes("mobile legends")||s.includes("mlbb"))
 return "Mobile Legends: Bang Bang is a 5v5 multiplayer online battle arena game. Its main roles include Tank, Fighter, Assassin, Mage, Marksman and Support.";

 if(s.includes("football")||s.includes("soccer"))
 return "Football is a team sport where two teams try to score by getting the ball into the opponent's goal. Each team normally has 11 players.";

 if(s.includes("joke"))
 return "Why did the computer go to the doctor? Because it had a virus!";

 if(s.includes("thank"))
 return "You're welcome! Ask me anything else.";

 if(s.includes("bye"))
 return "Goodbye! See you again on KarkiVerse.";

 // Basic arithmetic
 const math=s.match(/^\s*(-?\d+(?:\.\d+)?)\s*([+\-*/x×])\s*(-?\d+(?:\.\d+)?)\s*\??\s*$/);

 if(math){
  const a=Number(math[1]),b=Number(math[3]);
  let result;

  switch(math[2]){
   case "+":result=a+b;break;
   case "-":result=a-b;break;
   case "*":case "x":case "×":result=a*b;break;
   case "/":result=b===0?"Cannot divide by zero.":a/b;break;
  }

  return "The answer is "+result+".";
 }

 return null;
}

async function onlineAnswer(question){
 try{
  const searchURL="https://en.wikipedia.org/w/api.php?action=opensearch&search="
  +encodeURIComponent(question)+"&limit=1&namespace=0&format=json&origin=*";

  const searchResponse=await fetch(searchURL);
  if(!searchResponse.ok)throw new Error("Search unavailable");

  const results=await searchResponse.json();
  if(!results[1]||!results[1].length)return null;

  const title=results[1][0];

  const summaryURL="https://en.wikipedia.org/api/rest_v1/page/summary/"
  +encodeURIComponent(title);

  const summaryResponse=await fetch(summaryURL);
  if(!summaryResponse.ok)return null;

  const data=await summaryResponse.json();

  if(data.extract)
  return data.extract+"\n\nSource: Wikipedia";

 }catch(error){
  console.log("Online lookup unavailable",error);
 }

 return null;
}

async function sendMessage(){
 const question=input.value.trim();
 if(!question)return;

 stopSpeaking();
 addMessage(question,"user");

 input.value="";
 sendBtn.disabled=true;

 const loading=addMessage("Thinking...","bot");

 let answer=localAnswer(question);

 if(!answer){
  answer=await onlineAnswer(question);
 }

 if(!answer){
  answer="I don't have a programmed answer for that yet, and I couldn't find information online. I'm a free assistant with a small knowledge module, not a full AI model. Try asking me about schoolwork, internet basics or a specific topic.";
 }

 loading.querySelector("span").textContent=answer;

 chat.scrollTop=chat.scrollHeight;
 sendBtn.disabled=false;

 speak(answer);
 input.focus();
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

function startVoice(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("Voice input is not supported by this browser. Try Chrome on a supported device.");
  return;
 }

 if(recognition){
  try{recognition.stop()}catch(e){}
 }

 recognition=new SpeechRecognition();
 recognition.lang="en-IN";
 recognition.continuous=false;
 recognition.interimResults=false;

 const mic=document.getElementById("mic");
 mic.textContent="🔴";

 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };

 recognition.onerror=e=>{
  console.log("Voice input error:",e.error);
  mic.textContent="🎙";
 };

 recognition.onend=()=>{
  mic.textContent="🎙";
 };

 try{
  recognition.start();
 }catch(e){
  mic.textContent="🎙";
 }
}

if("speechSynthesis" in window){
 window.speechSynthesis.onvoiceschanged=()=>{
  window.speechSynthesis.getVoices();
 };
}
</script>

</body>
</html>
