
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarkiAI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#101113;
  color:#f5f5f5;
  min-height:100vh;
}

header{
  height:65px;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #292a2d;
}

.brand{font-size:21px;font-weight:700}
.brand span{color:#999}

.status{font-size:12px;color:#aaa}

main{
  max-width:850px;
  margin:auto;
  padding:35px 18px 150px;
}

.welcome{
  text-align:center;
  padding:25px 0 35px;
}

.hero-photo{
  width:105px;
  height:105px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #333;
  margin-bottom:20px;
}

.welcome h1{
  font-size:29px;
  margin-bottom:10px;
}

.welcome p{color:#999;font-size:14px}

.chat{
  display:flex;
  flex-direction:column;
  gap:23px;
}

.message{
  display:flex;
  align-items:flex-start;
  gap:12px;
  line-height:1.65;
  font-size:15px;
}

.message.user{justify-content:flex-end}

.message .avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
}

.bubble{
  max-width:80%;
  padding:12px 16px;
  border-radius:15px;
  background:#202124;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#303136;
}

.message .actions{
  display:flex;
  gap:10px;
  margin-top:8px;
}

.actions button{
  background:none;
  color:#999;
  border:none;
  cursor:pointer;
  font-size:12px;
}

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:linear-gradient(transparent,#101113 20%);
  padding:20px 15px 18px;
}

.input-area{
  max-width:800px;
  margin:auto;
  background:#202124;
  border:1px solid #393a3e;
  border-radius:17px;
  display:flex;
  align-items:flex-end;
  padding:10px;
  gap:8px;
}

textarea{
  flex:1;
  resize:none;
  background:transparent;
  color:white;
  border:none;
  outline:none;
  font-family:inherit;
  font-size:15px;
  padding:10px;
  min-height:42px;
  max-height:120px;
}

.tool{
  border:0;
  border-radius:11px;
  width:40px;
  height:40px;
  cursor:pointer;
  background:#303136;
  color:white;
  font-size:17px;
}

.tool:hover{background:#45464b}
.send{background:#f1f1f1;color:#111}
.send:hover{background:#ccc}

.hint{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-top:10px;
}

.typing{color:#999;font-size:13px}

@media(max-width:600px){
  header{height:58px;padding:0 15px}
  main{padding:22px 14px 140px}
  .welcome{padding:20px 0 30px}
  .welcome h1{font-size:25px}
  .hero-photo{width:90px;height:90px}
  .bubble{max-width:88%;font-size:14px}
}
</style>
</head>

<body>

<header>
  <div class="brand">Karki<span>AI</span></div>
  <div class="status">● Online demo</div>
</header>

<main>
  <section class="welcome" id="welcome">
    <img class="hero-photo" src="image.png" alt="KarkiAI">
    <h1>Hey! How can I help you?</h1>
    <p>Ask me anything. Let's talk.</p>
  </section>

  <section class="chat" id="chat"></section>
</main>

<div class="composer">
  <div class="input-area">
    <textarea id="input" placeholder="Message KarkiAI..." rows="1"></textarea>
    <button class="tool" id="mic" title="Speak">🎙</button>
    <button class="tool send" id="send" title="Send">➤</button>
  </div>
  <div class="hint">KarkiAI · Voice and text demo</div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const welcome = document.getElementById("welcome");

let indianVoice = null;

function chooseVoice(){
  if(!("speechSynthesis" in window)) return;

  const voices = speechSynthesis.getVoices();

  indianVoice =
    voices.find(v => v.lang.toLowerCase() === "en-in") ||
    voices.find(v => v.lang.toLowerCase().startsWith("en-in")) ||
    voices.find(v => v.lang.toLowerCase().startsWith("en-gb")) ||
    voices.find(v => v.lang.toLowerCase().startsWith("en"));

}

if("speechSynthesis" in window){
  chooseVoice();
  speechSynthesis.onvoiceschanged = chooseVoice;
}

function speak(text){
  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  chooseVoice();

  if(indianVoice) utterance.voice = indianVoice;

  utterance.lang = "en-IN";
  utterance.rate = 0.88;
  utterance.pitch = 0.78;
  utterance.volume = 1;

  speechSynthesis.speak(utterance);
}

function addMessage(text, type, shouldSpeak=false){
  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "message " + type;

  if(type === "ai"){
    const avatar = document.createElement("img");
    avatar.className = "avatar";
    avatar.src = "image.png";
    avatar.alt = "KarkiAI";
    row.appendChild(avatar);
  }

  const content = document.createElement("div");
  content.className = "bubble";
  content.textContent = text;

  if(type === "ai"){
    const actions = document.createElement("div");
    actions.className = "actions";

    const voiceButton = document.createElement("button");
    voiceButton.textContent = "🔊 Listen";
    voiceButton.onclick = () => speak(text);

    const copyButton = document.createElement("button");
    copyButton.textContent = "Copy";
    copyButton.onclick = () => {
      navigator.clipboard?.writeText(text);
      copyButton.textContent = "Copied!";
    };

    actions.append(voiceButton, copyButton);
    content.appendChild(actions);
  }

  row.appendChild(content);
  chat.appendChild(row);

  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});

  if(shouldSpeak) speak(text);
}

function getDemoReply(text){
  const t = text.toLowerCase().trim();

  // GREETINGS
  if(/^(hi|hello|hey|hii|heyy|yo|sup)\b/.test(t))
    return "Hey! What's up? What would you like to talk about?";

  if(t.includes("how are you"))
    return "I'm doing great! Ready to help you with anything I know. How are you?";

  if(t.includes("your name") || t.includes("who are you"))
    return "I'm KarkiAI, your friendly AI-style assistant!";

  if(t.includes("who created you") || t.includes("who made you"))
    return "I was created as part of the KarkiVerse project!";

  if(t.includes("what can you do") || t.includes("what can u do") ||
     t.includes("your abilities") || t.includes("your capabilities"))
    return "I can answer basic questions, explain internet and technology topics, help with school subjects, solve simple maths, write paragraphs, share ideas, tell jokes and chat with you. Ask me anything!";

  if(t.includes("are you real") || t.includes("are you human"))
    return "I'm a computer program, not a human. I'm KarkiAI!";

  if(t.includes("thank"))
    return "You're welcome! Happy to help. 😊";

  if(t.includes("good morning"))
    return "Good morning! Hope you have a great day!";

  if(t.includes("good night"))
    return "Good night! Have a peaceful sleep.";

  // INTERNET AND TECHNOLOGY
  if(t.includes("what is internet") || t.includes("define internet"))
    return "The Internet is a worldwide network connecting computers and devices. It lets people communicate, share information and access websites.";

  if(t.includes("what is www") || t.includes("world wide web"))
    return "WWW stands for World Wide Web. It is a collection of web pages and websites that we access using the Internet.";

  if(t.includes("what is browser"))
    return "A browser is an application used to open websites. Examples include Chrome, Safari, Firefox and Edge.";

  if(t.includes("what is google"))
    return "Google is a technology company. Its search engine helps people find information on the Internet.";

  if(t.includes("google vs chrome") || t.includes("difference between google and chrome"))
    return "Google is a company and search engine. Chrome is a web browser made by Google.";

  if(t.includes("what is search engine"))
    return "A search engine helps you find information online. Examples include Google, Bing and DuckDuckGo.";

  if(t.includes("what is website"))
    return "A website is a collection of related web pages that people can visit using a browser.";

  if(t.includes("what is url"))
    return "URL means Uniform Resource Locator. It is the address of a resource on the Internet.";

  if(t.includes("what is html"))
    return "HTML means HyperText Markup Language. It is used to create the structure of web pages.";

  if(t.includes("what is css"))
    return "CSS means Cascading Style Sheets. It controls the colours, fonts, spacing and design of websites.";

  if(t.includes("what is javascript"))
    return "JavaScript is a programming language that makes websites interactive and dynamic.";

  if(t.includes("what is wifi") || t.includes("what is wi-fi"))
    return "Wi-Fi is a wireless technology that connects devices to a network without needing a physical cable.";

  if(t.includes("what is ip address"))
    return "An IP address is a numerical address used to identify a device on a network.";

  if(t.includes("what is dns"))
    return "DNS stands for Domain Name System. It translates website names like google.com into IP addresses.";

  if(t.includes("what is server"))
    return "A server is a computer or program that provides information or services to other devices.";

  if(t.includes("what is cloud computing"))
    return "Cloud computing means using services like storage and software over the Internet.";

  if(t.includes("what is http") || t.includes("what is https"))
    return "HTTP is a protocol used to transfer information on the web. HTTPS is a more secure version that encrypts communication.";

  if(t.includes("what is cybersecurity"))
    return "Cybersecurity is the practice of protecting computers, networks and information from digital threats.";

  if(t.includes("what is phishing"))
    return "Phishing is an online scam where someone tries to trick people into sharing private information.";

  if(t.includes("what is vpn"))
    return "VPN means Virtual Private Network. It creates an encrypted connection between your device and a VPN server.";

  if(t.includes("what is database"))
    return "A database is an organized collection of information that can be stored, searched and managed.";

  if(t.includes("what is operating system"))
    return "An operating system manages a device's hardware and software. Examples include Windows, Android, macOS and Linux.";

  if(t.includes("what is ai") || t.includes("artificial intelligence"))
    return "AI means Artificial Intelligence. It is technology that allows computers to perform tasks that normally require human-like intelligence.";

  if(t.includes("what is email"))
    return "Email means electronic mail. It allows people to send and receive digital messages.";

  if(t.includes("what is computer"))
    return "A computer is an electronic device that processes data, performs calculations and stores information.";

  // BASIC SCIENCE
  if(t.includes("what is gravity"))
    return "Gravity is a force that attracts objects toward each other. Earth's gravity keeps us on the ground.";

  if(t.includes("what is photosynthesis"))
    return "Photosynthesis is the process by which green plants use sunlight, water and carbon dioxide to make food.";

  if(t.includes("what is atom"))
    return "An atom is the basic unit of an element. It contains protons, neutrons and electrons.";

  if(t.includes("what is electricity"))
    return "Electricity is a form of energy associated with the movement or presence of electric charges.";

  if(t.includes("what is solar system"))
    return "The Solar System consists of the Sun and all the planets, moons and other objects that orbit it.";

  if(t.includes("how many planets"))
    return "There are eight planets in our Solar System: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.";

  // GENERAL KNOWLEDGE
  if(t.includes("capital of nepal"))
    return "The capital city of Nepal is Kathmandu.";

  if(t.includes("capital of india"))
    return "The capital of India is New Delhi.";

  if(t.includes("largest planet"))
    return "Jupiter is the largest planet in our Solar System.";

  if(t.includes("fastest animal"))
    return "The peregrine falcon is the fastest animal when diving.";

  if(t.includes("how many continents"))
    return "There are seven continents: Asia, Africa, North America, South America, Antarctica, Europe and Australia.";

  if(t.includes("who is the president of nepal"))
    return "I may not have the latest political information. Please check a current reliable news source.";

  // SCHOOL HELP
  if(t.includes("what is democracy"))
    return "Democracy is a system of government in which people have the power to choose their leaders.";

  if(t.includes("what is pollution"))
    return "Pollution is the introduction of harmful substances into the environment, affecting air, water or land.";

  if(t.includes("what is environment"))
    return "The environment includes all the living and non-living things around us, such as air, water, plants and animals.";

  if(t.includes("what is a noun"))
    return "A noun is a word used to name a person, place, animal, thing or idea.";

  if(t.includes("what is a verb"))
    return "A verb is a word that describes an action or state, such as run, eat, think or be.";

  if(t.includes("help me with homework"))
    return "Of course! Send me your question and I'll try to explain it in simple language.";

  // CONVERSATION AND FUN
  if(t.includes("tell me a joke") || t.includes("make me laugh"))
    return "Why did the computer go to the doctor? Because it had a virus! 😂";

  if(t.includes("tell me something interesting"))
    return "Here's something interesting: octopuses have three hearts, and two of them help move blood through their gills!";

  if(t.includes("i am bored") || t.includes("im bored"))
    return "Let's fix that! We can talk about technology, football, anime, games or random interesting facts.";

  if(t.includes("i am sad") || t.includes("im sad"))
    return "I'm sorry you're having a rough day. Want to talk about what's bothering you?";

  if(t.includes("tell me a fact"))
    return "A day on Venus is longer than its year! Venus rotates very slowly.";

  // SIMPLE MATHS
  const math = t.match(/(-?\d+(?:\.\d+)?)\s*([+\-*/x])\s*(-?\d+(?:\.\d+)?)/);

  if(math){
    const a = Number(math[1]);
    const b = Number(math[3]);
    const op = math[2];
    let answer;

    if(op === "+") answer = a + b;
    if(op === "-") answer = a - b;
    if(op === "*" || op === "x") answer = a * b;
    if(op === "/") answer = b === 0 ? "Cannot divide by zero" : a / b;

    return "The answer is " + answer + " 🧮";
  }

  // HONEST FALLBACK
  return "That's an interesting question! I don't have a programmed answer for that yet. I can currently help with basic internet knowledge, technology, general knowledge, school topics and simple maths.";
}

function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  input.value = "";
  input.style.height = "42px";

  const reply = getDemoReply(text);

  setTimeout(() => {
    addMessage(reply,"ai");
  },350);
}

document.getElementById("send").addEventListener("click",sendMessage);

input.addEventListener("keydown",e=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input",()=>{
  input.style.height = "42px";
  input.style.height = Math.min(input.scrollHeight,120) + "px";
});

// VOICE INPUT
const mic = document.getElementById("mic");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.interimResults = false;

  mic.addEventListener("click",()=>{
    try{
      recognition.start();
      mic.textContent = "🔴";
    }catch(e){}
  });

  recognition.onresult = event=>{
    input.value = event.results[0][0].transcript;
    mic.textContent = "🎙";
    sendMessage();
  };

  recognition.onend = ()=>{
    mic.textContent = "🎙";
  };

  recognition.onerror = ()=>{
    mic.textContent = "🎙";
  };
}else{
  mic.addEventListener("click",()=>{
    alert("Voice input is not supported in this browser. Try Chrome.");
  });
}
</script>

</body>
</html>
