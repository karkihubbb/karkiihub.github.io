
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarkiAI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #101114;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  height: 65px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #292a30;
  background: #141519;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -1px;
}

.logo span {
  color: #8b9cff;
}

.status {
  color: #a5a5a5;
  font-size: 12px;
}

main {
  max-width: 850px;
  margin: auto;
  min-height: calc(100vh - 65px);
  display: flex;
  flex-direction: column;
  padding: 25px 18px 20px;
}

.welcome {
  text-align: center;
  margin: 65px 0 35px;
}

.avatar {
  width: 65px;
  height: 65px;
  margin: 0 auto 20px;
  border-radius: 22px;
  background: #242631;
  display: grid;
  place-items: center;
  font-size: 28px;
  font-weight: bold;
  border: 1px solid #383b49;
}

.welcome h1 {
  font-size: 30px;
  margin-bottom: 10px;
}

.welcome p {
  color: #999ba5;
  font-size: 14px;
}

#chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 25px;
}

.message {
  max-width: 85%;
  padding: 14px 17px;
  border-radius: 17px;
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #30333d;
  border-bottom-right-radius: 5px;
}

.ai {
  align-self: flex-start;
  background: #1b1d23;
  border: 1px solid #2b2d35;
  border-bottom-left-radius: 5px;
}

.composer {
  position: sticky;
  bottom: 10px;
  background: #1b1d23;
  border: 1px solid #383a43;
  border-radius: 18px;
  padding: 10px;
  display: flex;
  align-items: flex-end;
  gap: 9px;
  box-shadow: 0 8px 30px #0005;
}

textarea {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 15px;
  padding: 10px 5px;
  max-height: 130px;
  min-height: 40px;
  font-family: inherit;
}

textarea::placeholder {
  color: #858791;
}

.control {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 12px;
  background: #30333d;
  color: white;
  font-size: 17px;
  cursor: pointer;
  flex-shrink: 0;
}

.send {
  background: #8293ff;
  color: #101114;
  font-weight: bold;
}

.control:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.note {
  text-align: center;
  color: #777982;
  font-size: 11px;
  margin-top: 12px;
}

.typing {
  color: #a1a3ad;
  font-size: 13px;
  padding: 5px;
}

@media(max-width:600px) {
  main {
    padding: 15px 12px;
  }

  .welcome {
    margin-top: 45px;
  }

  .welcome h1 {
    font-size: 25px;
  }

  .message {
    max-width: 92%;
    font-size: 14px;
  }

  header {
    padding: 0 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Karki<span>AI</span></div>
  <div class="status">● AI Assistant</div>
</header>

<main>

  <section class="welcome" id="welcome">
    <div class="avatar">K</div>
    <h1>Hey, how can I help you?</h1>
    <p>Ask me anything. Let's figure it out together.</p>
  </section>

  <section id="chat"></section>

  <div class="composer">
    <button class="control" id="mic" title="Speak">🎙</button>

    <textarea
      id="message"
      placeholder="Message KarkiAI..."
      rows="1"
    ></textarea>

    <button class="control send" id="send">➤</button>
  </div>

  <div class="note">
    KarkiAI can make mistakes. Check important information.
  </div>

</main>

<script>
// IMPORTANT: Replace this with your actual deployed backend URL.
const API_URL = "https://YOUR-VERCEL-APP.vercel.app/api/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const micButton = document.getElementById("mic");
const welcome = document.getElementById("welcome");

let messages = [];
let busy = false;

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

  return div;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speech.rate = 0.95;
  speech.pitch = 0.9;

  const voices = speechSynthesis.getVoices();
  const indianVoice = voices.find(v =>
    v.lang.toLowerCase().includes("en-in")
  );

  if (indianVoice) speech.voice = indianVoice;

  speechSynthesis.speak(speech);
}

const funnyFallback =
  "I'm a free AI made by Sir Karki. It's free, what more do you expect? 😂 " +
  "I have a small brain module right now! If you want me to answer that, " +
  "I'd need a bigger module (and money for it). For now, I can help with " +
  "internet-related questions, technology and schoolwork!";

async function sendMessage() {
  const text = input.value.trim();

  if (!text || busy) return;

  welcome.style.display = "none";
  addMessage(text, "user");

  messages.push({
    role: "user",
    content: text
  });

  input.value = "";
  input.style.height = "40px";

  busy = true;
  sendButton.disabled = true;

  const loading = document.createElement("div");
  loading.className = "typing";
  loading.textContent = "KarkiAI is thinking...";
  chat.appendChild(loading);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages.slice(-16)
      })
    });

    if (!response.ok) {
      throw new Error("AI server error");
    }

    const data = await response.json();

    if (!data.reply || typeof data.reply !== "string") {
      throw new Error("No reply received");
    }

    messages.push({
      role: "assistant",
      content: data.reply
    });

    loading.remove();
    addMessage(data.reply, "ai");
    speak(data.reply);

  } catch (error) {
    loading.remove();

    const errorMessage =
      "I can't connect to my AI brain right now. Please check the backend connection and try again.";

    addMessage(errorMessage, "ai");

  } finally {
    busy = false;
    sendButton.disabled = false;
    input.focus();
  }
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "40px";
  input.style.height =
    Math.min(input.scrollHeight, 130) + "px";
});

// Voice input
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  micButton.addEventListener("click", () => {
    try {
      recognition.start();
      micButton.textContent = "🔴";
    } catch (error) {
      micButton.textContent = "🎙";
    }
  });

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    input.dispatchEvent(new Event("input"));
    sendMessage();
  };

  recognition.onend = () => {
    micButton.textContent = "🎙";
  };

  recognition.onerror = () => {
    micButton.textContent = "🎙";
  };

} else {
  micButton.style.display = "none";
}
</script>

</body>
</html>
