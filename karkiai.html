<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>KarkiAI — KarkiVerse</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#09090b;color:#f5f5f5;font-family:Inter,Arial,sans-serif;overflow:hidden}
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(9,9,11,.96);border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:2}
.brand{font-weight:800;letter-spacing:.02em}.brand span{color:#cbd5e1}
.actions{display:flex;align-items:center;gap:14px}
a{color:#e5e7eb;text-decoration:none;font-size:13px}
a:hover{color:#fff;text-decoration:underline}
main{height:calc(100dvh - 54px);width:100%;position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:#09090b}
@media(max-width:560px){.topbar{padding:0 12px}.actions{gap:10px}a{font-size:12px}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand">Karki<span>AI</span></div>
 <nav class="actions" aria-label="Page navigation">
  <a href="index.html">← KarkiVerse</a>
  <a href="https://karkiai.onrender.com/" target="_blank" rel="noopener noreferrer">Open full app ↗</a>
 </nav>
</header>
<main>
 <iframe src="https://karkiai.onrender.com/" title="KarkiAI app" allow="microphone; clipboard-read; clipboard-write" allowfullscreen></iframe>
</main>

<style id="kv-karkiai-spider-layer">.topbar{z-index:30;background:rgba(8,8,9,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}</style>
<style id="kv-premium-nav-refresh">
/* KarkiVerse: clean editorial navigation and responsive page polish */
:root{--kv-accent:#ef4935}
.kv-header{z-index:30;background:rgba(8,8,9,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom-color:rgba(255,255,255,.085)}
.kv-bar{height:68px}
.kv-logo{letter-spacing:-.045em}
.kv-nav{gap:clamp(8px,1.3vw,20px)}
.kv-nav a{padding:22px 9px;color:#aaa;font-size:13px;letter-spacing:.015em}
.kv-nav a:hover,.kv-nav a[aria-current=page]{color:#fff}
.kv-ind{height:2px;background:var(--kv-accent)}
.kv-burger{border-color:rgba(255,255,255,.16);border-radius:3px}
.kv-nav.open{z-index:40}
@media(max-width:720px){
 .kv-bar{height:64px}
 .kv-nav{gap:0}
 .kv-nav a{padding:15px 4px;font-size:16px}
}
@media(min-width:721px){
 .kv-nav a{padding-top:24px;padding-bottom:24px}
}
</style><script type="module" src="/spider-entry.tsx"></script>
</body>
</html>
