
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarkiAI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101114;
  color:#f5f5f5;
  font-family:Arial,sans-serif;
}
header{
  padding:20px;
  border-bottom:1px solid #292a30;
  font-size:21px;
  font-weight:bold;
}
main{
  max-width:850px;
  margin:auto;
  padding:25px 18px 120px;
}
.hero{text-align:center;padding:35px 0 25px}
.hero img{
  width:105px;height:105px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #383a40;
}
.hero h2{font-size:25px;margin-bottom:8px}
.hero p{color:#999}
#chat{display:flex;flex-direction:column;gap:17px}
.message{
  padding:14px 17px;
  border-radius:16px;
  max-width:85%;
  line-height:1.6;
  white-space:pre-wrap;
}
.user{
  background:#292b32;
  align-self:flex-end;
}
.ai{
  background:#1b1c21;
  align-self:flex-start;
}
.ai img{
  width:25px;height:25px;
  border-radius:50%;
  object-fit:cover;
  vertical-align:middle;
  margin-right:8px;
}
.composer{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#101114;
  padding:14px;
  border-top:1px solid #292a30;
}
.input-area{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:9px;
}
textarea{
  flex:1;
  resize:none;
  height:48px;
  border-radius:15px;
  padding:14px;
  background:#24262d;
  color:white;
  border:1px solid #383a40;
  outline:none;
  font-size:15px;
}
button{
  border:0;
  border-radius:13px;
  padding:0 16px;
  background:#f0f0f0;
  color:#111;
  font-size:18px;
  cursor:pointer;
}
#mic{background:#292b32;color:white}
.note{text-align:center;color:#777;font-size:11px;margin-top:8px}
</style>
</head>

<body>

<header>KarkiAI</header>

<main>
  <section class="hero" id="hero">
    <img src="image.png" alt="KarkiAI">
    <h2>Hey! How can I help you?</h2>
    <p>Ask me anything. I'm here to help.</p>
  </section>

  <div id="chat"></div>
</main>

<div class="composer">
  <div class="input-area">
    <textarea id="input" placeholder="Message KarkiAI..." rows="1"></textarea>
    <button id="mic" onclick="startMic()">🎙</button>
    <button onclick="sendMessage()">➤</button>
  </div>
  <div class="note">KarkiAI can make mistakes.</div>
</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const hero = document.getElementById("hero");

let voices = [];

function loadVoices(){
  voices = speechSynthesis.getVoices();
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function speak(text){
  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-IN";
  utterance.rate = 0.9;
  utterance.pitch = 0.8;

  const indianVoice = voices.find(v =>
    v.lang.toLowerCase().includes("en-in")
  );

  if(indianVoice) utterance.voice = indianVoice;

  speechSynthesis.speak(utterance);
}

function addMessage(text,type){
  hero.style.display = "none";

  const div = document.createElement("div");
  div.className = "message " + type;

  if(type === "ai"){
    const img = document.createElement("img");
    img.src = "image.png";
    img.alt = "KarkiAI";
    div.appendChild(img);
  }

  div.appendChild(document.createTextNode(text));
  chat.appendChild(div);
  window.scrollTo(0,document.body.scrollHeight);
}

function getReply(q){
  q=q.toLowerCase().trim();

  if(/^(hi|hello|hey|hii)\b/.test(q))
    return "Hey! How are you doing today? What would you like to talk about?";

  if(q.includes("how are you"))
    return "I'm doing great! Thanks for asking. How can I help you today?";

  if(q.includes("your name"))
    return "I'm KarkiAI, your personal AI assistant.";

  if(q.includes("who made you"))
    return "I was created as part of the KarkiVerse project.";

  if(q.includes("what can you do"))
    return "I can help with general knowledge, technology, school subjects, maths, explanations, ideas and everyday questions.";

  if(q.includes("internet"))
    return "The Internet is a worldwide network that connects computers and devices. It allows us to communicate, search for information, watch videos and use websites.";

  if(q.includes("www") || q.includes("world wide web"))
    return "WWW stands for World Wide Web. It is a collection of connected web pages that we access through the Internet.";

  if(q.includes("browser"))
    return "A browser is an application used to visit websites. Examples include Google Chrome, Safari, Firefox and Microsoft Edge.";

  if(q.includes("google"))
    return "Google is a technology company best known for its search engine, which helps people find information on the Internet.";

  if(q.includes("website"))
    return "A website is a collection of related web pages available on the Internet. Websites are commonly built using HTML, CSS and JavaScript.";

  if(q.includes("html"))
    return "HTML stands for HyperText Markup Language. It provides the structure and content of a web page.";

  if(q.includes("css"))
    return "CSS stands for Cascading Style Sheets. It controls how a website looks, including its colors, fonts, spacing and layout.";

  if(q.includes("javascript"))
    return "JavaScript is a programming language that makes websites interactive. It can handle buttons, animations, forms and much more.";

  if(q.includes("wifi"))
    return "Wi-Fi is a wireless technology that allows devices to connect to a network and access the Internet without a physical cable.";

  if(q.includes("artificial intelligence") || q === "what is ai")
    return "Artificial intelligence, or AI, is technology that allows computers to perform tasks such as understanding language, recognizing images and answering questions.";

  if(q.includes("server"))
    return "A server is a computer or software system that provides information or services to other computers over a network.";

  if(q.includes("gravity"))
    return "Gravity is the force of attraction between objects that have mass. Earth's gravity keeps us on the ground.";

  if(q.includes("photosynthesis"))
    return "Photosynthesis is the process by which green plants use sunlight, water and carbon dioxide to produce food and release oxygen.";

  if(q.includes("capital of nepal"))
    return "The capital of Nepal is Kathmandu.";

  if(q.includes("capital of india"))
    return "The capital of India is New Delhi.";

  if(q.includes("planets"))
    return "There are eight planets in our solar system: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.";

  if(q.includes("joke"))
    return "Why did the computer go to the doctor? Because it caught a virus!";

  if(q.includes("bored"))
    return "Let's make things interesting! We could try a fun quiz, learn something surprising or come up with a crazy story.";

  if(q.includes("sad"))
    return "I'm sorry you're having a difficult day. Want to talk about what's bothering you?";

  if(q.includes("time"))
    return "You can check the current time on your device. I don't have access to a live clock in this demo.";

  const math = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*([+\-*\/])\s*(-?\d+(?:\.\d+)?)\s*\??\s*$/);
  if(math){
    const a=Number(math[1]), b=Number(math[3]);
    let result;
    switch(math[2]){
      case "+": result=a+b; break;
      case "-": result=a-b; break;
      case "*": result=a*b; break;
      case "/": result=b===0 ? "undefined (division by zero)" : a/b; break;
    }
    return "The answer is " + result + ".";
  }

  return "That's an interesting question! I'm currently a basic demo assistant, so I don't know the answer to everything yet. I can still help with basic technology, Internet, school topics and general knowledge.";
}

function sendMessage(){
  const text=input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  input.value="";

  const reply=getReply(text);

  setTimeout(()=>{
    addMessage(reply,"ai");
    speak(reply);
  },350);
}

input.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

function startMic(){
  const Recognition=window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!Recognition){
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition=new Recognition();
  recognition.lang="en-IN";
  recognition.onresult=function(event){
    input.value=event.results[0][0].transcript;
    sendMessage();
  };
  recognition.start();
}
</script>

</body>
</html>
