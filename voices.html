const voiceSelect = document.getElementById("voice");
const deepSelect = document.getElementById("deepVoice");

function loadVoices() {
  const voices = speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";
  deepSelect.innerHTML = '<option value="">Choose a device voice</option>';

  voices.forEach((voice, index) => {
    const label = voice.name + " (" + voice.lang + ")";

    const normalOption = new Option(label, index);
    voiceSelect.add(normalOption);

    const deepOption = new Option(label, index);
    deepSelect.add(deepOption);
  });

  if (voices.length > 0) {
    const englishVoice = voices.findIndex(v =>
      v.lang.toLowerCase().startsWith("en")
    );

    if (englishVoice >= 0) {
      voiceSelect.value = englishVoice;
      deepSelect.value = englishVoice;
    }
  }
}

function speakText() {
  const text = document.getElementById("text").value.trim();

  if (!text) {
    document.getElementById("msg").textContent="Type something first.";
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();

  const deepMode = deepSelect.value !== "";
  const selected = deepMode
    ? deepSelect.value
    : voiceSelect.value;

  if (selected !== "" && voices[selected]) {
    speech.voice = voices[selected];
  }

  if (deepMode) {
    speech.rate = 0.94;
    speech.pitch = 0.92;
  } else {
    speech.rate = 1;
    speech.pitch = 1;
  }

  document.getElementById("msg").textContent="Speaking…";speech.onend=()=>document.getElementById("msg").textContent="";speechSynthesis.speak(speech);
}

function stopText() {
  speechSynthesis.cancel();
}

loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;
